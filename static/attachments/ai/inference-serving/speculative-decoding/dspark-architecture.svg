<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">DSpark semi-autoregressive speculative decoding architecture</title>
  <desc id="desc">A target model supplies multi-layer hidden features to a parallel DFlash backbone. A lightweight Markov head adds causal token dependencies, a confidence head estimates prefix survival, a hardware-aware scheduler chooses verification length, and the target verifies the chosen prefix.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker>
    <style>.title{font:700 29px system-ui,sans-serif;fill:#f8fafc}.head{font:700 19px system-ui,sans-serif;fill:#f8fafc}.body{font:15px system-ui,sans-serif;fill:#cbd5e1}.tiny{font:13px system-ui,sans-serif;fill:#94a3b8}.arrow{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#38bdf8;stroke-width:3;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1500" height="720" rx="24" fill="#0f172a"/>
  <text x="750" y="48" text-anchor="middle" class="title">DSpark: parallel capacity, cheap causal coherence, selective verification</text>
  <rect x="55" y="110" width="245" height="145" rx="15" fill="#3b0764" stroke="#9333ea"/><text x="177" y="145" text-anchor="middle" class="head">Frozen target model</text><text x="177" y="177" text-anchor="middle" class="body">accepted prefix + anchor</text><text x="177" y="205" text-anchor="middle" class="body">selected layer features</text><text x="177" y="232" text-anchor="middle" class="tiny">authoritative distribution p</text>
  <path d="M305 182 H380" class="arrow"/>
  <rect x="390" y="110" width="235" height="145" rx="15" fill="#164e63" stroke="#0891b2"/><text x="507" y="145" text-anchor="middle" class="head">Feature fusion</text><text x="507" y="177" text-anchor="middle" class="body">concat target layers</text><text x="507" y="204" text-anchor="middle" class="body">projection + RMSNorm</text><text x="507" y="231" text-anchor="middle" class="tiny">context Hctx</text>
  <path d="M630 182 H705" class="arrow"/>
  <rect x="715" y="90" width="290" height="185" rx="15" fill="#172554" stroke="#2563eb"/><text x="860" y="126" text-anchor="middle" class="head">Parallel DFlash backbone</text><text x="860" y="158" text-anchor="middle" class="body">anchor + mask slots</text><text x="860" y="185" text-anchor="middle" class="body">bidirectional block attention</text><text x="860" y="212" text-anchor="middle" class="body">target context injected as KV</text><text x="860" y="247" text-anchor="middle" class="tiny">one heavy draft forward pass</text>
  <path d="M1010 182 H1085" class="arrow"/>
  <rect x="1095" y="100" width="340" height="165" rx="15" fill="#1e293b" stroke="#64748b"/><text x="1265" y="138" text-anchor="middle" class="head">All positions at once</text><text x="1265" y="171" text-anchor="middle" class="body">hidden states h₁ … hγ</text><text x="1265" y="201" text-anchor="middle" class="body">unary logits U₁ … Uγ</text><text x="1265" y="233" text-anchor="middle" class="tiny">strong marginals, no sampled-token dependency yet</text>
  <path d="M1265 270 V332" class="arrow"/>
  <rect x="1045" y="342" width="440" height="150" rx="15" fill="#064e3b" stroke="#10b981"/><text x="1265" y="378" text-anchor="middle" class="head">Lightweight sequential Markov head</text><text x="1265" y="411" text-anchor="middle" class="body">logits = Uk(v) + W₁[xk−1] W₂</text><text x="1265" y="441" text-anchor="middle" class="body">sample x₁ → condition x₂ → … → xγ</text><text x="1265" y="471" text-anchor="middle" class="tiny">tiny serial path walk; no backbone rerun</text>
  <path d="M1040 417 H940" class="arrow"/>
  <rect x="670" y="342" width="260" height="150" rx="15" fill="#422006" stroke="#d97706"/><text x="800" y="378" text-anchor="middle" class="head">Confidence head</text><text x="800" y="411" text-anchor="middle" class="body">conditional survival ck</text><text x="800" y="441" text-anchor="middle" class="body">prefix survival ∏i≤k ci</text><text x="800" y="471" text-anchor="middle" class="tiny">post-hoc calibrated</text>
  <path d="M665 417 H565" class="arrow"/>
  <rect x="265" y="332" width="290" height="170" rx="15" fill="#4c0519" stroke="#e11d48"/><text x="410" y="368" text-anchor="middle" class="head">Hardware-aware scheduler</text><text x="410" y="401" text-anchor="middle" class="body">confidence × profiled SPS(B)</text><text x="410" y="431" text-anchor="middle" class="body">choose prefix length per request</text><text x="410" y="461" text-anchor="middle" class="tiny">longer at low load; selective at high load</text>
  <path d="M405 507 V583 H175 V267" class="dash"/><text x="530" y="575" class="body">scheduled draft prefix returns to target for one parallel verification</text>
  <rect x="695" y="560" width="690" height="105" rx="15" fill="#111827" stroke="#475569"/><text x="1040" y="594" text-anchor="middle" class="head">Exact verifier remains authoritative</text><circle cx="845" cy="630" r="21" fill="#16a34a"/><text x="845" y="636" text-anchor="middle" class="head">✓</text><circle cx="905" cy="630" r="21" fill="#16a34a"/><text x="905" y="636" text-anchor="middle" class="head">✓</text><circle cx="965" cy="630" r="21" fill="#dc2626"/><text x="965" y="636" text-anchor="middle" class="head">×</text><circle cx="1035" cy="630" r="21" fill="#d97706"/><text x="1035" y="636" text-anchor="middle" class="head">x*</text><text x="1190" y="636" class="body">accept prefix, correct first rejection</text>
</svg>
