<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="690" viewBox="0 0 1500 690" role="img" aria-labelledby="title desc">
  <title id="title">History and architectural evolution of speculative decoding</title>
  <desc id="desc">Timeline from blockwise decoding through exact speculative sampling, trees, Medusa and multi-token prediction, EAGLE, DFlash, and DSpark.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>.title{font:700 29px system-ui,sans-serif;fill:#f8fafc}.year{font:700 18px system-ui,sans-serif;fill:#38bdf8}.name{font:700 18px system-ui,sans-serif;fill:#f8fafc}.body{font:14px system-ui,sans-serif;fill:#cbd5e1}.axis{stroke:#64748b;stroke-width:4;marker-end:url(#arrow)}.stem{stroke:#64748b;stroke-width:3}</style>
  </defs>
  <rect width="1500" height="690" rx="24" fill="#0f172a"/>
  <text x="750" y="48" text-anchor="middle" class="title">Speculative decoding: the bottleneck moves from verification to drafting to scheduling</text>
  <line x1="90" y1="340" x2="1420" y2="340" class="axis"/>
  <g transform="translate(80 95)"><rect width="220" height="175" rx="14" fill="#172554" stroke="#2563eb"/><text x="18" y="30" class="year">2018</text><text x="18" y="58" class="name">Blockwise decoding</text><text x="18" y="88" class="body">Parallel future heads</text><text x="18" y="110" class="body">Longest validated prefix</text><text x="18" y="142" class="body">Established the pattern</text><line x1="110" y1="175" x2="110" y2="245" class="stem"/></g>
  <g transform="translate(320 370)"><line x1="110" y1="-30" x2="110" y2="0" class="stem"/><rect width="230" height="190" rx="14" fill="#3b0764" stroke="#9333ea"/><text x="18" y="30" class="year">2022–2023</text><text x="18" y="58" class="name">Exact speculation</text><text x="18" y="88" class="body">Draft model + target</text><text x="18" y="110" class="body">Rejection sampling</text><text x="18" y="132" class="body">Residual correction</text><text x="18" y="164" class="body">Same target distribution</text></g>
  <g transform="translate(570 95)"><rect width="240" height="175" rx="14" fill="#164e63" stroke="#0891b2"/><text x="18" y="30" class="year">2023–2024</text><text x="18" y="58" class="name">Trees + Medusa</text><text x="18" y="88" class="body">Alternative branches</text><text x="18" y="110" class="body">Tree attention</text><text x="18" y="132" class="body">Target-attached heads</text><text x="18" y="154" class="body">No second backbone</text><line x1="120" y1="175" x2="120" y2="245" class="stem"/></g>
  <g transform="translate(830 370)"><line x1="120" y1="-30" x2="120" y2="0" class="stem"/><rect width="240" height="190" rx="14" fill="#064e3b" stroke="#10b981"/><text x="18" y="30" class="year">2024–2025</text><text x="18" y="58" class="name">MTP + EAGLE</text><text x="18" y="88" class="body">Causal future modules</text><text x="18" y="110" class="body">Feature-level drafting</text><text x="18" y="132" class="body">Dynamic trees</text><text x="18" y="154" class="body">Multi-layer feature fusion</text></g>
  <g transform="translate(1090 95)"><rect width="300" height="175" rx="14" fill="#422006" stroke="#d97706"/><text x="18" y="30" class="year">2026</text><text x="18" y="58" class="name">DFlash → DSpark</text><text x="18" y="88" class="body">Parallel block-diffusion drafter</text><text x="18" y="110" class="body">Cheap causal transition head</text><text x="18" y="132" class="body">Calibrated survival confidence</text><text x="18" y="154" class="body">Load-aware verification</text><line x1="150" y1="175" x2="150" y2="245" class="stem"/></g>
  <text x="95" y="635" class="body">Evolution of the optimization target:</text><text x="330" y="635" class="name">exactness</text><text x="420" y="635" class="body">→</text><text x="452" y="635" class="name">branch coverage</text><text x="590" y="635" class="body">→</text><text x="622" y="635" class="name">target feature reuse</text><text x="805" y="635" class="body">→</text><text x="837" y="635" class="name">parallel drafting</text><text x="980" y="635" class="body">→</text><text x="1012" y="635" class="name">serving-wide goodput</text>
</svg>
