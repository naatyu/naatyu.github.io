# Prepared replacement for .github/workflows/deploy.yml; NOT active.
# Apply only after migration review and explicit publication approval.
name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Check hosting location
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          test "$PAGES_ORIGIN" = "https://naatyu.github.io"
          test -z "$PAGES_BASE_PATH"
      - name: Install build dependencies
        run: npm ci
      - name: Verify publication packaging
        run: npm run test:publication
      - name: Build publication artifact
        id: site
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          import {buildPublication} from './scripts/build-publication.mjs';
          const result = await buildPublication();
          appendFileSync(process.env.GITHUB_OUTPUT, `artifact=${result.output}\n`);
          console.log(JSON.stringify(result, null, 2));
          JS
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.artifact }}
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
